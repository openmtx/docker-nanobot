name: Build and Push

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Read nanobot version
        id: nanobot
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' nanobot/pyproject.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not read version from nanobot/pyproject.toml" >&2
            exit 1
          fi
          echo "Building nanobot $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/openmtx/nanobot:latest
            ghcr.io/openmtx/nanobot:${{ steps.nanobot.outputs.version }}
            ghcr.io/openmtx/nanobot:${{ steps.nanobot.outputs.version }}-${{ github.sha }}
